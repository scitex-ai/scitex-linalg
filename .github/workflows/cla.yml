name: CLA Assistant

# ORG-LEVEL REUSABLE-WORKFLOW CALLER (scitex-ai/.github).
# Triggers/permissions preserved verbatim from the prior local file.
# This repo's prior allowlist included an extra login (LLEmacs) beyond the
# reusable default ("bot*,ywatanabe1989") — overridden via `with:` below
# so the allowlist behavior is unchanged.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
